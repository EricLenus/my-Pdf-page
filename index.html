<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }
        header {
            text-align: center;
            padding: 15px;
            background: #183153;
            color: white;
        }
        h2 {
            margin: 5px;
        }
        .pdf-container {
            width: 100%;
            height: calc(100vh - 85px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <h2>Gabriel Ngodoyo Pulei</h2>
    </header>
    <div class="pdf-container">
        <iframe
            src="./Gabriel Ndogoyo Pulei.pdf#toolbar=0"
            title="PDF Document">
        </iframe>
    </div>

</body>
</html>
